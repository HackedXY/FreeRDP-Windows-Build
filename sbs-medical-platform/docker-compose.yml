# Déploiement de production : docker compose up -d
# Prérequis : fichier .env (voir .env.example) et un nom de domaine pointant vers le serveur.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbs
      POSTGRES_USER: postgres                                   # super-utilisateur : provisionnement uniquement
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD requis}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?OWNER_DB_PASSWORD requis}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD requis}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?BACKUP_DB_PASSWORD requis}
      TZ: Africa/Conakry
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  # Migrations + initialisation : seul service à détenir les identifiants propriétaire.
  # S'exécute puis s'arrête (docker compose run --rm migrate pour une mise à jour).
  migrate:
    build: .
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    command: ["node", "src/db/seed.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://sbs:${OWNER_DB_PASSWORD}@db:5432/sbs
      DATABASE_URL: postgres://sbs_app:${APP_DB_PASSWORD}@db:5432/sbs
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY requis}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY requis}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      # Rôle restreint : pas de droits propriétaire (l'application refuse de démarrer sinon)
      DATABASE_URL: postgres://sbs_app:${APP_DB_PASSWORD}@db:5432/sbs
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
      COOKIE_SECURE: "true"
    volumes:
      - uploads:/data/uploads

  # Reverse proxy HTTPS (certificat Let's Encrypt automatique)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requis}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  # Sauvegarde automatique quotidienne, chiffrée, avec rotation
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGHOST: db
      PGUSER: sbs_backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD}
      PGDATABASE: sbs
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE requis}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      TZ: Africa/Conakry
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && while true; do if [ \"$$(date +%H)\" = \"$$(printf %02d $$BACKUP_HOUR)\" ]; then /bin/sh /backup.sh; sleep 3700; fi; sleep 600; done"]

volumes:
  pgdata:
  uploads:
  caddy_data:
