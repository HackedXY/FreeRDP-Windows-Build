<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Hors ligne — SBS MediGest</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f766e; color: #fff;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.4rem; margin: 16px 0 8px; }
    p { opacity: .9; line-height: 1.5; }
    .btn { display: inline-block; text-decoration: none; margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #fff; color: #0f766e; font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>
  <!-- Page statique : aucune donnée patient ni financière n'est conservée hors ligne -->
  <div class="card">
    <img src="/icon-192.png" alt="" />
    <h1>Connexion au cabinet indisponible</h1>
    <p>SBS MediGest nécessite une connexion au serveur. Par sécurité, aucune donnée médicale n'est enregistrée sur cet appareil.</p>
    <a class="btn" href="/">Réessayer</a>
  </div>
</body>
</html>
